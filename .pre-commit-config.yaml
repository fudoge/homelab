ci:
  autofix_prs: true
  autoupdate_schedule: monthly
  skip:
    # These hooks require external binaries unavailable on pre-commit.ci runners.
    - terraform_fmt
    - terraform_validate
    - terraform_tflint
    - terraform_trivy
    - terraform_docs

default_install_hook_types:
  - pre-commit
  - commit-msg

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        stages: [pre-commit]
      - id: end-of-file-fixer
        stages: [pre-commit]

      - id: check-yaml
        stages: [pre-commit]
        exclude: ^terraform/live/50\.proxmox-global/99\.cloud-init/
        args:
          - -m
      - id: check-json
        stages: [pre-commit]
      - id: check-toml
        stages: [pre-commit]

      - id: check-merge-conflict
        stages: [pre-commit]
      - id: check-added-large-files
        stages: [pre-commit]
      - id: check-case-conflict
        stages: [pre-commit]

  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.108.1
    hooks:
      - id: terraform_fmt
        stages: [pre-commit]
        args:
          - --hook-config=--tf-path=tofu
      - id: terraform_validate
        stages: [pre-commit]
        args:
          - --hook-config=--tf-path=tofu
          - --tf-init-args=-backend=false
      - id: terraform_tflint
        stages: [pre-commit]
      - id: terraform_trivy
        stages: [pre-commit]
        args:
          - --args=--severity=HIGH,CRITICAL
          - --args=--skip-dirs=**/.terraform
      - id: terraform_docs
        stages: [pre-commit]
        files: ^terraform/modules/
        args:
          - --hook-config=--path-to-file=README.md
          - --hook-config=--add-to-existing-file=true
          - --hook-config=--create-file-if-not-exist=true

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args:
          - hotfix
          - workaround
