apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cilium
  namespace: kube-system
spec:
  interval: 10m

  targetNamespace: kube-system

  install:
    createNamespace: true

  chart:
    spec:
      chart: cilium
      version: "1.20.0"
      sourceRef:
        kind: HelmRepository
        name: cilium
      interval: 10m

  valuesFrom:
    - kind: ConfigMap
      name: cilium-values
      valuesKey: values.yaml
