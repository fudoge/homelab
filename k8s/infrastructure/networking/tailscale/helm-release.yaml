apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tailscale
  namespace: tailscale
spec:
  interval: 10m

  targetNamespace: tailscale

  chart:
    spec:
      chart: tailscale-operator
      version: "1.104.4"
      sourceRef:
        kind: HelmRepository
        name: tailscale
      interval: 10m

  values:
    apiServerProxyConfig:
      mode: "true"
