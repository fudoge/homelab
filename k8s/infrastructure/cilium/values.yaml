# References: https://artifacthub.io/packages/helm/cilium/cilium/1.20.0
kubeProxyReplacement: true
k8sServiceHost: 192.168.0.37
k8sServicePort: 6443

devices: ens18
routingMode: native
autoDirectNodeRoutes: true
ipv4NativeRoutingCIDR: 10.42.0.0/16

# Cilium Agent metrics
prometheus:
  enabled: true
  metrics:
    - cilium_bpf_map_pressure
    - cilium_drop_total
    - cilium_forward_total

# Operator metrics
operator:
  replicas: 1
  prometheus:
    enabled: true

gatewayAPI:
  enabled: false
ingressController:
  enabled: false

# Hubble
hubble:
  enabled: true
  relay:
    enabled: true
    tls:
      server:
        enabled: false
  ui:
    enabled: true
  metrics:
    enableOpenMetrics: true
    enabled:
      - dns
      - drop:sourceContext=pod;destinationContext=pod
      - tcp
      - flow
      - port-distribution
      - httpV2
      - policy

# IPAM
ipam:
  mode: cluster-pool
  operator:
    clusterPoolIPv4PodCIDRList:
      - 10.42.0.0/16 # k3s default
    clusterPoolIPv4MaskSize: 24
    clusterPoolIPv6PodCIDRList:
      - fd00::/104

# Masquerade(NAT)
enableIPv4Masquerade: true
enableIpv6Masquerade: false

# NetworkPolicy
enableNetworkPolicy: true

# Security
encryption:
  enabled: false # It is recommended when you use multi-node cluster
  type: wireguard
