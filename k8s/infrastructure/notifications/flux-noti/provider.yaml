apiVersion: notification.toolkit.fluxcd.io/v1beta3
kind: Provider
metadata:
  name: ntfy-gateway
  namespace: flux-system
spec:
  type: generic
  address: http://gateway.ntfy.svc.cluster.local/api/webhooks/flux
  secretRef:
    name: ntfy-gateway
---
apiVersion: notification.toolkit.fluxcd.io/v1beta3
kind: Provider
metadata:
  name: slack-bot
  namespace: flux-system
spec:
  type: slack
  channel: notifications
  address: https://slack.com/api/chat.postMessage
  secretRef:
    name: slack-bot-token
