apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - alertmanager
  - helm-release.yaml
  - helm-repo.yaml
  - namespace.yaml
  - storage.yaml

configMapGenerator:
  - name: kps-values
    namespace: observability
    files:
      - values.yaml=values.yaml

namespace: observability

generatorOptions:
  disableNameSuffixHash: true
