prometheusOperator:
  admissionWebhooks:
    certManager:
      enabled: true

# k3s runs with --disable-kube-proxy; Cilium replaces it.
kubeProxy:
  enabled: false

prometheus:
  prometheusSpec:
    retention: 15d
    retentionSize: 18GiB
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: observability-local
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 20Gi
          selector:
            matchLabels:
              observability-storage: prometheus

alertmanager:
  serviceAccount:
    name: observability-kube-prometh-alertmanager

  alertmanagerSpec:
    volumes:
      - name: aws-token
        projected:
          sources:
            - serviceAccountToken:
                path: aws
                audience: sts.amazonaws.com
                expirationSeconds: 3600
    volumeMounts:
      - name: aws-token
        mountPath: /var/run/secrets/tokens
        readOnly: true
    containers:
      - name: alertmanager
        env:
          - name: AWS_ROLE_ARN
            value: arn:aws:iam::647502392199:role/homelab-alertmanager
          - name: AWS_WEB_IDENTITY_TOKEN_FILE
            value: /var/run/secrets/tokens/aws
          - name: AWS_REGION
            value: ap-northeast-2
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: observability-local
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 2Gi
          selector:
            matchLabels:
              observability-storage: alertmanager
    alertmanagerConfigMatcherStrategy:
      type: OnNamespaceExceptForAlertmanagerNamespace

  config:
    route:
      routes: []

grafana:
  persistence:
    enabled: true
    storageClassName: observability-local
    volumeName: observability-grafana
    accessModes:
      - ReadWriteOnce
    size: 2Gi
