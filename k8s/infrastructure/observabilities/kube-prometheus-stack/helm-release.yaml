apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: observability
spec:
  interval: 10m

  targetNamespace: observability

  install:
    createNamespace: true

  chartRef:
    kind: OCIRepository
    name: kube-prometheus-stack
    namespace: observability

  valuesFrom:
    - kind: ConfigMap
      name: kps-values
      valuesKey: values.yaml
