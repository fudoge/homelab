apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: watchdog-heartbeat
  namespace: observability
spec:
  route:
    receiver: heartbeat
    groupBy:
      - alertname
    groupWait: 0s
    groupInterval: 1m
    repeatInterval: 1m
    matchers:
      - name: alertname
        value: Watchdog
        matchType: "="
  receivers:
    - name: heartbeat
      snsConfigs:
        - topicARN: arn:aws:sns:ap-northeast-2:647502392199:homelab-heartbeat
          sendResolved: false
          message: Watchdog
          sigv4:
            region: ap-northeast-2
