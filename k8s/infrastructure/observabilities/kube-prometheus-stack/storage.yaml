apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: observability-local
provisioner: kubernetes.io/no-provisioner
volumeBindingMode: WaitForFirstConsumer
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: observability-prometheus
  labels:
    observability-storage: prometheus
spec:
  capacity:
    storage: 20Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: observability-local
  local:
    path: /var/lib/rancher/k3s/storage/prometheus
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - home-cp-1
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: observability-alertmanager
  labels:
    observability-storage: alertmanager
spec:
  capacity:
    storage: 2Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: observability-local
  local:
    path: /var/lib/rancher/k3s/storage/alertmanager
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - home-cp-1
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: observability-grafana
spec:
  capacity:
    storage: 2Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: observability-local
  local:
    path: /var/lib/rancher/k3s/storage/grafana
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - home-cp-1
