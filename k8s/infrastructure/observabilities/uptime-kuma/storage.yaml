apiVersion: v1
kind: PersistentVolume
metadata:
  name: observability-uptime-kuma
  labels:
    observability-storage: uptime-kuma
spec:
  capacity:
    storage: 1Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: observability-local
  local:
    path: /var/lib/rancher/k3s/storage/uptime-kuma
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - home-cp-1
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: uptime-kuma
  namespace: observability
spec:
  accessModes:
    - ReadWriteOnce
  volumeMode: Filesystem
  resources:
    requests:
      storage: 1Gi
  storageClassName: "observability-local"
  volumeName: observability-uptime-kuma
