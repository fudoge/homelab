apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: uptime-kuma
  name: uptime-kuma
  namespace: observability
spec:
  replicas: 1
  selector:
    matchLabels:
      app: uptime-kuma
  template:
    metadata:
      labels:
        app: uptime-kuma
    spec:
      containers:
        - image: uptime-kuma:2.5.11
          name: uptime-kuma
          volumeMounts:
            - name: uptime-kuma-data
              mountPath: /app/data
  volumes:
    - name: uptime-kuma-data
      persistentVolumeClaim:
        claimName: uptime-kuma
